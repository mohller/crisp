name: Post-Release Compatibility Matrix

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        deps: ["min", "latest", "pre"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install minimum declared dependencies
        if: matrix.deps == 'min'
        # These are NOT simply pyproject.toml's per-package floors (astropy>=6.1,
        # numpy>=2.0, pandas>=2.1, scipy>=1.11, matplotlib>=3.8): numpy 2.0 was a
        # breaking release, and pandas/scipy/matplotlib releases from before it
        # cannot be jointly installed with numpy==2.0 (pandas 2.1.0 is ABI-
        # incompatible at import time; scipy 1.11.x/matplotlib 3.8.x cap
        # numpy<2 in their own metadata) -- bumped to each package's first
        # release with real numpy-2.0 support instead. scipy==1.11.0 itself is
        # additionally yanked from PyPI (license violation). Verified locally:
        # Python 3.10 + this exact set imports cleanly and the full suite
        # passes (97/97).
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" \
            "astropy==6.1.0" "numpy==2.0.0" "pandas==2.2.2" \
            "scipy==1.13.0" "pint==0.24.4" "sympy==1.12" "matplotlib==3.9.0"

      - name: Install latest stable dependencies
        if: matrix.deps == 'latest'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install pre-release dependencies
        if: matrix.deps == 'pre'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" --pre

      - name: Cache CRPropa tables
        uses: actions/cache@v4
        with:
          path: ~/.cache/crisp
          key: crpropa-tables-v1

      - name: Run compatibility tests
        run: |
          pytest tests/ --tb=short -v -p no:warnings
