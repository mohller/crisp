[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crisp-pypi"
version = "0.1.0"
description = "Cosmic Ray Stochastic Interactions for Propagation"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Leonel Morejon", email = "leonel.morejon@uni-wuppertal.de"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astropy>=6.1",
    "numpy>=2.0",
    "pandas>=2.1",
    "scipy>=1.11",
    "pint>=0.22",
    "sympy>=1.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "flake8>=4.0",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
    "nbsphinx>=0.8",
]

[project.scripts]
crisp-fetch-data = "crisp.data_download:fetch_crpropa_tables"

[project.urls]
Homepage = "https://github.com/mohller/crisp"
"Bug Tracker" = "https://github.com/mohller/crisp/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["crisp*"]

[tool.setuptools.package-data]
crisp = ["data/*", "data/**/*"]
